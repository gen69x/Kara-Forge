name: Build Kernel onclite

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev zip curl git python3 jq ccache

      - name: Clone kernel
        run: |
          REPO=$(jq -r '.onclite.kernel_repo' devices/onclite.json)
          BRANCH=$(jq -r '.onclite.kernel_branch' devices/onclite.json)
          git clone --depth=1 -b "$BRANCH" "$REPO" kernel_src

      - name: Clone toolchain
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/gen69x/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git
          cp -r AnyKernel3 kernel_src/

      - name: Stage builder files
        run: |
          cp -r devices scripts config.env kernel_src/

      - name: Build
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source config.env
          bash scripts/goodies.sh onclite ksu
          bash scripts/compile.sh onclite ksu

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Kara-BakaSU-onclite
          path: kernel_src/Kara-BakaSU-onclite-*.zip

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: kernel_src/*-build.log
